why:
  label: Strengths
  title: Why work with me
  items:
    - title: Science meets engineering
      text: >-
        A PhD in trustworthy AI and years of shipping production software. I know the methods,
        and how to make them work in practice.
    - title: Proven where it matters
      text: >-
        I build AI for healthcare, where data quality, safety and compliance are not optional.
        That discipline pays off in any industry.
    - title: From prototype to product
      text: >-
        I lead an AI development team, so I know what it takes to turn a promising PoC into a
        system people rely on.
    - title: Honest advice
      text: I'm not a one-trick pony! If AI is not the right answer to your problem, you will hear it and the right suggestion from me.

approach:
  label: Process
  title: Start small, decide with confidence
  steps:
    - name: Intro call
      meta: Free · 30 min
      text: We talk about your challenge and whether I'm the right fit. No obligation.
    - name: Workshop
      meta: Fixed price per quote
      text: A focused half-day or full-day session on your use cases. You get a prioritized, written roadmap.
    - name: Solution design
      meta: Fixed price per quote
      text: Architecture, feasibility check, effort and cost estimate. A solid basis for your decision.
    - name: Build & support
      meta: Day rate
      text: I implement the solution, alone or with your team, from prototype to production. Ongoing advice if you need it.

