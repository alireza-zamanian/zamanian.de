services:
  label: Services
  title: How I can help
  items:
    - title: AI strategy & adoption
      summary: >-
        Find out where AI, including AI agents, creates real value in your organization, and
        introduce it safely.
      points:
        - Use-case discovery and prioritization
        - AI and agent strategy, roadmap, build vs. buy
        - Governance, risk and EU AI Act readiness
        - Workshops and enablement for your teams
    - title: AI-powered software
      summary: >-
        Bring me a digitalization challenge. I design the AI solution and, if you like, build it
        with you.
      points:
        - "Solution architecture: LLMs, RAG, agents, classic ML"
        - Prototypes and proofs of concept
        - Production-ready implementation, e.g. on Azure
        - Integration with your existing systems and processes
    - title: Data analysis & statistics
      summary: Reliable answers from your data, with methods that stand up to scrutiny.
      points:
        - Statistical analysis and modeling
        - Incomplete and messy data
        - Causal questions, study and experiment design
        - Forecasting, time series and predictive models

