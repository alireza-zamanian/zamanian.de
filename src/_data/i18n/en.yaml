faq:
  label: FAQ
  title: Common questions
  items:
    - q: Do you work in German?
      a: >-
        Meetings, workshops and documents are in English. My German is at B1 level, so I can
        follow German material, but English lets us work precisely and efficiently.
    - q: Do you work remotely or on-site?
      a: Both. I work remotely with clients across Germany and Europe, and on-site in and around Munich.
    - q: How do you handle confidential data?
      a: >-
        With care. I'm used to working with sensitive medical data. I'm happy to sign an NDA, and
        I handle personal data in line with the GDPR.
    - q: What does it cost?
      a: >-
        The intro call is free. Workshops and solution designs have a fixed price; implementation
        is billed by the day. You always get a written proposal before any work starts.

