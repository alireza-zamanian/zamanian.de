hero:
  title: KI, die nicht nur <em>in der Demo</em> überzeugt.
  lead: >-
    Ich helfe Unternehmen, die KI-Anwendungsfälle zu finden, die wirklich zählen, tragfähige
    Lösungen zu entwerfen und sie umzusetzen – mit wissenschaftlicher Gründlichkeit und dem
    Pragmatismus eines Ingenieurs.
  primary: Kostenloses Erstgespräch buchen
  secondary: Lebenslauf ansehen
  languageNote: Beratung und Zusammenarbeit derzeit auf Englisch.

proof:
  - Promotion in Informatik, TUM
  - KI-Teamleiter bei SYNLAB International
  - (ehemals) Forschung bei Fraunhofer IKS & Helmholtz Munich
  - Publikationen u. a. in Statistics in Medicine & JMLR

services:
  label: Leistungen
  title: Wobei ich Sie unterstütze
  items:
    - title: KI-Strategie & -Einführung
      summary: >-
        Finden Sie heraus, wo KI – einschließlich KI-Agenten – in Ihrem Unternehmen echten
        Nutzen stiftet, und führen Sie sie sicher ein.
      points:
        - Identifikation und Priorisierung von Anwendungsfällen
        - KI- und Agenten-Strategie, Roadmap, Make-or-Buy
        - Governance, Risiken und Vorbereitung auf den EU AI Act
        - Workshops und Befähigung Ihrer Teams
    - title: KI-gestützte Software
      summary: >-
        Sie stehen vor einer Digitalisierungsaufgabe? Ich entwerfe die KI-Lösung und setze sie
        auf Wunsch gemeinsam mit Ihnen um.
      points:
        - "Lösungsarchitektur: LLMs, RAG, Agenten, klassisches ML"
        - Prototypen und Proofs of Concept
        - Produktionsreife Umsetzung, z. B. auf Azure
        - Integration in Ihre bestehenden Systeme und Prozesse
    - title: Datenanalyse & Statistik
      summary: Belastbare Antworten aus Ihren Daten – mit Methoden, die einer kritischen Prüfung standhalten.
      points:
        - Statistische Analyse und Modellierung
        - Unvollständige und unsaubere Daten
        - Kausale Fragestellungen, Studien- und Versuchsdesign
        - Prognosen, Zeitreihen und Vorhersagemodelle

projects:
  label: Projekte
  title: Ausgewählte Projekte

why:
  label: Stärken
  title: Was mich auszeichnet
  items:
    - title: Wissenschaft trifft Engineering
      text: >-
        Eine Promotion zu vertrauenswürdiger KI und jahrelange Erfahrung mit produktiver Software.
        Ich kenne die Methoden – und weiß, wie man sie in der Praxis zum Laufen bringt.
    - title: Bewährt, wo es darauf ankommt
      text: >-
        Ich entwickle KI für das Gesundheitswesen, wo Datenqualität, Sicherheit und Compliance
        Pflicht sind. Diese Sorgfalt zahlt sich in jeder Branche aus.
    - title: Vom Prototyp zum Produkt
      text: >-
        Ich leite ein KI-Entwicklungsteam und weiß, was es braucht, damit aus einer
        vielversprechenden Demo ein verlässliches System wird.
    - title: Ehrliche Beratung
      text: >-
        Ich habe mehr als nur einen Hammer im Werkzeugkasten! Wenn KI nicht die richtige Antwort
        auf Ihr Problem ist, sage ich es Ihnen – und schlage vor, was besser passt.

approach:
  label: Ablauf
  title: Klein anfangen, sicher entscheiden
  steps:
    - name: Erstgespräch
      meta: Kostenlos · 30 Min.
      text: Wir sprechen über Ihre Herausforderung und darüber, ob ich der Richtige dafür bin. Unverbindlich.
    - name: Workshop
      meta: Festpreis
      text: Eine fokussierte Sitzung (halber oder ganzer Tag) zu Ihren Anwendungsfällen. Sie erhalten eine priorisierte, schriftliche Roadmap.
    - name: Lösungskonzept
      meta: Festpreis
      text: Architektur, Machbarkeitsprüfung sowie Aufwands- und Kostenschätzung – eine solide Grundlage für Ihre Entscheidung.
    - name: Umsetzung & Begleitung
      meta: Tagessatz
      text: Ich setze die Lösung um, allein oder mit Ihrem Team, vom Prototyp bis zum produktiven Einsatz. Auf Wunsch mit laufender Beratung.
  note: Jede Zusammenarbeit beginnt mit einem schriftlichen Angebot, das Umfang und Preis klar festlegt.

about:
  label: Über mich
  title: Hallo, ich bin Alireza.
  paragraphs:
    - >-
      Ich bin KI-Ingenieur in München und leite ein KI-Entwicklungsteam bei SYNLAB, einem der
      größten Anbieter medizinischer Labordiagnostik in Europa.
    - >-
      Zuvor habe ich fünf Jahre in der angewandten Forschung bei Fraunhofer IKS und Helmholtz
      Munich gearbeitet und an der TUM in Informatik promoviert – zum Thema vertrauenswürdige KI
      in der Medizin. Meine Arbeiten zu fehlenden Daten, Erklärbarkeit und kausaler Inferenz sind
      unter anderem in JMLR und Statistics in Medicine erschienen.
    - >-
      Angefangen habe ich als Data Scientist in der Industrie, nach einem Studium des Maschinenbaus
      und der Robotik. Wenn ich nicht an KI arbeite, findet man mich meistens beim Zeichnen.
  facts:
    - label: Standort
      value: München
    - label: Arbeitssprache
      value: Englisch
    - label: Arbeitsweise
      value: Remote oder vor Ort im Raum München
    - label: Sprachen
      value: Englisch, Deutsch (B1), Persisch

