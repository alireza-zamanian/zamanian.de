faq:
  label: FAQ
  title: Häufige Fragen
  items:
    - q: Arbeiten Sie auch auf Deutsch?
      a: >-
        Besprechungen, Workshops und Unterlagen sind auf Englisch. Mein Deutsch liegt auf
        B1-Niveau: Deutschsprachige Unterlagen kann ich nachvollziehen, auf Englisch arbeiten wir
        aber präziser und effizienter. Schreiben Sie mir gern auf Deutsch – ich antworte auf Englisch.
    - q: Arbeiten Sie remote oder vor Ort?
      a: Beides. Remote mit Kunden in ganz Deutschland und Europa, vor Ort in München und Umgebung.
    - q: Wie gehen Sie mit vertraulichen Daten um?
      a: >-
        Sorgfältig – ich bin den Umgang mit sensiblen medizinischen Daten gewohnt. Eine
        Vertraulichkeitsvereinbarung (NDA) unterschreibe ich gern, und personenbezogene Daten
        verarbeite ich DSGVO-konform.
    - q: Was kostet die Zusammenarbeit?
      a: >-
        Das Erstgespräch ist kostenlos. Workshops und Lösungskonzepte biete ich zum Festpreis an,
        die Umsetzung rechne ich nach Tagessatz ab. Vor Beginn erhalten Sie immer ein
        schriftliches Angebot.

contact:
  label: Kontakt
  title: Lassen Sie uns über Ihr Projekt sprechen.
  text: Schreiben Sie mir kurz, woran Sie arbeiten. In der Regel antworte ich innerhalb eines Werktags.
  book: Erstgespräch buchen
  email: E-Mail schreiben
  mailSubject: Erstgespräch
  note: Sie können mir gern auf Deutsch schreiben. Gespräche führen wir auf Englisch.
  conflict: Projekte im Bereich der medizinischen Labordiagnostik oder in dessen Nähe stimme ich vorab kurz mit meinem aktuellen Arbeitgeber ab.
  next:
    title: So geht es weiter
    steps:
      - Sie wählen einen Termin für ein kostenloses, 30-minütiges Videogespräch.
      - Wir besprechen Ihre Herausforderung und mögliche Lösungswege.
      - Wenn es passt, erhalten Sie ein schriftliches Angebot mit Umfang und Preis.

